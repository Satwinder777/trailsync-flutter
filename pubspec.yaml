name: trailsync
description: Offline-first GPS tracking and synchronization foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  connectivity_plus: ^6.1.5
  dio: ^5.11.1
  drift: 2.31.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.2
  flutter_map: ^8.3.2
  http: ^1.5.0
  geolocator: ^14.1.2
  get_it: ^9.3.0
  go_router: ^17.5.0
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: 2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - .env
